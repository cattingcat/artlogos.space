server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name artlogos.space _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Revalidate the entrypoint so new deployments reference the new asset names.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/((en|ru|fr|de|it|es|ja)/)?llms(-full)?\.txt$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Language selection happens in the browser only at the root entrypoint.
    # Explicit language URLs always serve their own prerendered HTML.
    location ~ ^/(en|ru|fr|de|it|es|ja)(/?|/index\.html|/works/[a-z0-9-]+(/|/index\.html)?)$ {
        absolute_redirect off;
        if (!-e $request_filename) {
            return 404;
        }
        if ($request_uri ~ "^(/(en|ru|fr|de|it|es|ja)/(works/[a-z0-9-]+/)?)index\.html(\?.*)?$") {
            return 301 $1$is_args$args;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Every artwork has its own build-time HTML; missing works remain real 404s.
    location ~ ^/works/[a-z0-9-]+(/|/index\.html)?$ {
        absolute_redirect off;
        if (!-e $request_filename) {
            return 404;
        }
        # Match the original client request, not nginx's internal index lookup.
        if ($request_uri ~ "^(/works/[a-z0-9-]+/)index\.html(\?.*)?$") {
            return 301 $1$is_args$args;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Preserve the published category URLs while the app uses query navigation.
    location ~ ^/category/(all|landscapes|cityscapes|figures|portraits|interiors)/?$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Vite adds content hashes to these filenames.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Missing files must return 404, not the SPA's HTML entrypoint.
    location ~* \.(avif|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|js|mjs|css|json|xml|txt|md)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    listen [::]:8080;
    server_name www.artlogos.space;
    server_tokens off;

    return 301 https://artlogos.space$request_uri;
}
